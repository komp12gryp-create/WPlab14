<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .block {
            height: 75px;
            border: 1px solid #cccccc;
            text-align: center;
        }

        @media (min-width: 1200px) {
            .header-left, .footer-right { background: #f6da9e; }
            .header-right { color: red; }
            .footer-left { color: blue; }
        }

        @media (min-width: 992px) and (max-width: 1199.98px) {
            .header-right, .content, .footer-left { background: pink; }
        }

        @media (min-width: 768px) and (max-width: 991.98px) {
            .menu-left, .menu-right { background: #eea8f5; }
        }

        @media (max-width: 767.98px) {
            .block {
                height: 50px;
                color: green;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <div class="col-12 col-md-6 col-lg-4 col-xl-8 block header-left">Студентський портал</div>
            <div class="col-12 col-md-6 col-lg-8 col-xl-4 block header-right">Особистий кабінет</div>
        </div>
        <div class="row g-0">
            <div class="col-12 col-lg-2 block menu-left">Навчальні дисципліни</div>
            <div class="col-12 col-lg-8 block content">Розклад занять</div>
            <div class="col-12 col-lg-2 block menu-right">Оголошення</div>
        </div>
        <div class="row g-0">
            <div class="col-12 col-md-6 col-lg-8 col-xl-3 block footer-left">Контакти</div>
            <div class="col-12 col-md-6 col-lg-4 col-xl-9 block footer-right">© 2026 Студентський портал</div>
        </div>
    </div>
</body>
</html>
