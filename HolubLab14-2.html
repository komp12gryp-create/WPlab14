<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .block {
            height: 150px;
            border: 1px solid #cccccc;
            color: white;
            font-size: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .first { background: #4f84bc; }
        .second { background: #ffbf00; }
        .third { background: #cc0000; }

        @media (min-width: 992px) and (max-width: 1199.98px) {
            .third { height: 100px; }
        }

        @media (max-width: 767.98px) {
            .block {
                height: 100px;
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <div class="col-12 col-lg-8 col-xl-6 block first">Розклад</div>
            <div class="col-12 col-md-6 col-lg-4 col-xl-3 block second">Завдання</div>
            <div class="col-12 col-md-6 col-lg-12 col-xl-3 block third">Новини</div>
        </div>
    </div>
</body>
</html>
